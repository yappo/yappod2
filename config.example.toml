format_version = 2

[index]
directory = "./index"

[tokenizer]
id = "unicode_nfkc_casefold_v2"

[chunking]
max_chars = 1200
overlap_chars = 200

[vector]
enabled = false

[metadata]
filterable_fields = []

[daemon]
run_directory = "./run"
core_host = "127.0.0.1"
core_port = 18401
front_host = "127.0.0.1"
front_port = 18400
front_io_threads = 16
core_io_threads = 16
core_search_threads = 16
core_writer_queue_capacity = 1
core_writer_queue_bytes = 134217728
max_inflight = 16
max_inflight_bytes = 4194304
request_timeout_ms = 5000
ingest_max_body_bytes = 67108864
ingest_timeout_ms = 60000
auto_compact_enabled = true
auto_compact_check_interval_ms = 30000
auto_compact_small_segment_bytes = 67108864
auto_compact_min_small_segments = 4
